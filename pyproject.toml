[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statereceipt"
version = "0.1.0"
description = "Reference implementation for the StateReceipt v0.1 work-state receipt specification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "StateReceipt contributors"}]
dependencies = [
  "typer>=0.12,<1",
  "rich>=13,<15",
  "PyYAML>=6,<7",
  "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
statereceipt = "statereceipt.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
statereceipt = ["schema/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
